server:
  http:
    address: ":8080"
    read_timeout: 15s
    write_timeout: 30s
    idle_timeout: 60s
    read_header_timeout: 5s

ingestion:
  queue:
    max_events: 100000
    max_bytes: 268435456
    enqueue_timeout: 25ms
  batch:
    max_events: 1000
    max_bytes: 4194304
    max_age: 1s
  retry:
    max_attempts: 5
    initial_backoff: 100ms
    max_backoff: 5s
  sources:
    - id: syslog-udp
      name: Syslog UDP
      protocol: udp
      address: ":1514"
      parser: auto
      enabled: true
      max_message_bytes: 65536
      tenant_id: default
      timezone: UTC
    - id: syslog-tcp
      name: Syslog TCP
      protocol: tcp
      address: ":1514"
      parser: auto
      framing: auto
      enabled: true
      max_message_bytes: 65536
      max_connections: 1024
      tenant_id: default
      timezone: UTC

storage:
  type: victorialogs
  endpoint: http://victorialogs:9428
  timeout: 10s
  stream_fields: [tenant_id, source_type, hostname, app_name]

control_store:
  enabled: false
  timeout: 5s

shutdown:
  timeout: 20s
