services:
  syslogx:
    build:
      context: .
    image: syslogx:dev
    environment:
      SYSLOGX_CONTROL_STORE_ENABLED: "true"
      SYSLOGX_CONTROL_STORE_DSN: postgres://syslogx:syslogx@postgres:5432/syslogx?sslmode=disable
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      victorialogs:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "514:1514/udp"
      - "514:1514/tcp"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [frontend, backend]

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=30d
      - -search.maxQueryDuration=30s
      - -search.maxConcurrentRequests=8
    volumes:
      - victorialogs-data:/victoria-logs-data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9428/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: syslogx
      POSTGRES_USER: syslogx
      POSTGRES_PASSWORD: syslogx
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syslogx -d syslogx"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

volumes:
  victorialogs-data:
  postgres-data:

networks:
  frontend:
  backend:
    internal: true
