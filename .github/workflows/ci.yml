name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: true
      - run: go mod verify
      - run: test -z "$(gofmt -l backend)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./backend/cmd/syslogx
